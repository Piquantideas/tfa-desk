<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TFA Brand Desk</title>
<style>
:root{--bg:#F3F5F4;--surface:#FFFFFF;--line:#D5DCD9;--ink:#17201D;--muted:#5B6863;--accent:#2E7A69;--err:#B4411A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111715;--surface:#18201D;--line:#2E3A35;--ink:#E6ECE9;--muted:#9AA8A2;--accent:#6CC2AC;--err:#F0875F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px;width:min(360px,100%);display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:700 22px Georgia,serif}
p{margin:0;color:var(--muted);font-size:14px}
input,button{font:inherit;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{min-height:1.4em;color:var(--err);font-size:13px}
</style>
</head>
<body>
<form id="f">
  <h1>TFA Brand Desk</h1>
  <p>Internal to The Forward Assembly. Enter the team password to open the dashboard.</p>
  <label for="pw" style="font-size:13px;font-weight:600">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button id="go" type="submit">Open dashboard</button>
  <div id="msg" role="alert"></div>
</form>
